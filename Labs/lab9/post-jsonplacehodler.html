<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Adding a New Post</title>
</head>
<body>
<h1>Adding a new post</h1>
<div id="demo"></div>
<script>
  async function addPost() {
    try {
      const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=UTF-8"
        },
        body: JSON.stringify({
          userId: 1,
          title: "Fix my bugs",
          completed: false
        })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      document.querySelector("#demo").textContent = JSON.stringify(data);
    } catch (err) {
      document.querySelector("#demo").textContent = `Error: ${err.message}`;
    }
  }
  addPost();
</script>
</body>
</html>
